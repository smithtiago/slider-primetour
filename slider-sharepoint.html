<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: 'Segoe UI', sans-serif; }

  .slider {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fff;
    overflow: hidden;
    position: relative;
  }

  .dots {
    display: flex;
    justify-content: flex-end;
    gap: 5px;
    padding: 6px 10px 0;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ccc;
    cursor: pointer;
    transition: background 0.2s;
  }

  .dot.active { background: #0078d4; }

  .track {
    display: flex;
    align-items: center;
    min-height: 56px;
    position: relative;
    padding: 10px 44px;
  }

  .slide { display: none; text-align: center; width: 100%; }
  .slide.active { display: block; }

  .slide-title {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 3px;
  }

  .slide-text {
    font-size: 12px;
    color: #555;
    line-height: 1.5;
  }

  .btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #888;
    font-size: 20px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background 0.2s;
  }

  .btn:hover { background: #f0f0f0; color: #333; }
  .btn.prev { left: 4px; }
  .btn.next { right: 4px; }
</style>
</head>
<body>

<div class="slider">
  <div class="dots" id="dots"></div>
  <div class="track">
    <button class="btn prev" onclick="move(-1)">&#8249;</button>
    <div id="slides" style="width:100%"></div>
    <button class="btn next" onclick="move(1)">&#8250;</button>
  </div>
</div>

<script>
  /* ================================================
     EDITE SEUS SLIDES AQUI
     Adicione ou remova objetos { title, text }
  ================================================ */
  const slides = [
    {
      title: "Atualização de Liderança",
      text: "Nosso novo Diretor de Operações ingressou oficialmente na equipe, trazendo anos de experiência para guiar nossa próxima fase de crescimento."
    },
    {
      title: "Novos Benefícios 2025",
      text: "A partir de abril, todos os colaboradores terão acesso ao programa de bem-estar ampliado. Confira os detalhes no portal RH."
    },
    {
      title: "Evento Trimestral",
      text: "A reunião geral do Q2 acontece no dia 15 de abril, às 10h, de forma híbrida. Confirme sua presença pelo link na intranet."
    }
  ];
  /* ================================================ */

  let cur = 0, timer;
  const cont = document.getElementById('slides');
  const dotsEl = document.getElementById('dots');

  slides.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'slide' + (i === 0 ? ' active' : '');
    d.innerHTML = `<div class="slide-title">${s.title}</div><div class="slide-text">${s.text}</div>`;
    cont.appendChild(d);

    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => go(i);
    dotsEl.appendChild(dot);
  });

  function go(n) {
    document.querySelectorAll('.slide')[cur].classList.remove('active');
    document.querySelectorAll('.dot')[cur].classList.remove('active');
    cur = (n + slides.length) % slides.length;
    document.querySelectorAll('.slide')[cur].classList.add('active');
    document.querySelectorAll('.dot')[cur].classList.add('active');
    reset();
  }

  function move(d) { go(cur + d); }
  function reset() { clearInterval(timer); timer = setInterval(() => move(1), 5000); }
  reset();
</script>
</body>
</html>
